: "2 עוגות בחושות פרוסות", "d": "", "p": 125}, {"id": "d57", "n": "עוגיות ביתיות · קטן", "d": "", "p": 148}, {"id": "d58", "n": "עוגיות ביתיות · גדול", "d": "", "p": 236}, {"id": "d59", "n": "מיני מוזלי", "d": "", "p": 16}, {"id": "d60", "n": "מוזלי", "d": "", "p": 21}, {"id": "d61", "n": "כוס ירקות", "d": "", "p": 21}, {"id": "d62", "n": "כוס פירות", "d": "", "p": 22}], "dairy": true, "banner": true}]</script>
<script>
(function(){
  const menu = JSON.parse(document.getElementById('data').textContent);
  const qty = {};
  const items = {};
  const fmt = n => '₪' + n.toLocaleString('he-IL');
  const nav = document.getElementById('cats');
  const main = document.getElementById('menu');

  menu.forEach((c, ci) => {
    const sec = document.createElement('section');
    sec.className = 'cat' + (c.feature ? ' feature' : '');
    sec.id = 'c' + ci;
    if (!c.feature && !c.banner) { const h = document.createElement('h2'); h.textContent = c.name; sec.append(h); }
    c.items.forEach(it => {
      items[it.id] = it; qty[it.id] = 0;
      const row = document.createElement('div'); row.className = 'dish';
      const t = document.createElement('div'); t.className = 'txt';
      const n = document.createElement('div'); n.className = 'nm'; n.textContent = it.n; t.append(n);
      if (it.d) { const d = document.createElement('div'); d.className = 'ds'; d.textContent = it.d; t.append(d); }
      const p = document.createElement('div'); p.className = 'pr'; p.textContent = fmt(it.p); t.append(p);
      const st = document.createElement('div'); st.className = 'step';
      const minus = document.createElement('button'); minus.type = 'button'; minus.textContent = '−'; minus.setAttribute('aria-label', 'הורדה של ' + it.n);
      const q = document.createElement('span'); q.className = 'q'; q.textContent = '0';
      const plus = document.createElement('button'); plus.type = 'button'; plus.textContent = '+'; plus.setAttribute('aria-label', 'הוספה של ' + it.n);
      st.append(plus, q, minus);
      const set = v => { qty[it.id] = Math.max(0, v); q.textContent = qty[it.id]; minus.disabled = qty[it.id] === 0; row.classList.toggle('on', qty[it.id] > 0); update(); };
      plus.addEventListener('click', () => set(qty[it.id] + 1));
      minus.addEventListener('click', () => set(qty[it.id] - 1));
      minus.disabled = true;
      row.append(t, st);
      sec.append(row);
    });
    if (c.banner) {
      const b = document.createElement('div'); b.className = 'banner';
      const e = document.createElement('div'); e.className = 'eyebrow'; e.textContent = 'תפריט חלבי';
      const h = document.createElement('div'); h.className = 'banner-h'; h.textContent = 'מגשי אירוח';
      const p = document.createElement('p'); p.className = 'banner-p'; p.textContent = 'מגשים מוכנים להגשה. המחיר הוא למגש.';
      b.append(e, h, p);
      main.append(b);
    }
    main.append(sec);
    const a = document.createElement('a'); a.href = '#c' + ci; a.textContent = (c.dairy ? 'חלבי · ' : '') + c.name;
    a.addEventListener('click', e => { e.preventDefault(); sec.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
    nav.append(a);
  });

  const tot = document.getElementById('tot'), cnt = document.getElementById('cnt'), send = document.getElementById('send');
  const fields = ['f-name', 'f-date', 'f-guests', 'f-notes'].map(id => document.getElementById(id));
  fields.forEach(f => f.addEventListener('input', update));

  function message(){
    const v = id => document.getElementById(id).value.trim();
    const lines = ['שלום, הזמנה ממטבח קאסה'];
    if (v('f-name')) lines.push('שם: ' + v('f-name'));
    if (v('f-date')) { const [y,m,d] = v('f-date').split('-'); lines.push('תאריך האירוע: ' + d + '.' + m + '.' + y); }
    if (v('f-guests')) lines.push('מספר אורחים: ' + v('f-guests'));
    lines.push('');
    let sum = 0;
    menu.forEach(c => c.items.forEach(it => {
      const k = qty[it.id]; if (!k) return;
      sum += k * it.p;
      lines.push((c.dairy ? 'חלבי · ' : '') + it.n + ' × ' + k + ' = ' + fmt(k * it.p));
    }));
    lines.push('', 'סה"כ משוער: ' + fmt(sum));
    if (v('f-notes')) lines.push('', 'הערות: ' + v('f-notes'));
    return lines.join('\n');
  }

  function update(){
    let sum = 0, n = 0;
    Object.keys(qty).forEach(id => { sum += qty[id] * items[id].p; n += qty[id]; });
    tot.textContent = fmt(sum);
    cnt.textContent = n ? (n + ' מנות בהזמנה') : 'עוד לא נבחרו מנות';
    send.setAttribute('aria-disabled', n ? 'false' : 'true');
    send.href = 'https://wa.me/972525304883?text=' + encodeURIComponent(message());
  }

  document.getElementById('copy').addEventListener('click', e => {
    const btn = e.currentTarget, text = message();
    const ok = () => { btn.textContent = 'הועתק'; setTimeout(() => btn.textContent = 'העתקה', 1600); };
    const fallback = () => {
      let ta = document.getElementById('copy-fallback');
      if (!ta) { ta = document.createElement('textarea'); ta.id = 'copy-fallback'; ta.setAttribute('aria-label', 'טקסט ההזמנה'); document.getElementById('details').append(ta); }
      ta.value = text; ta.focus(); ta.select();
    };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (_) { fallback(); }
  });

  update();
})();
</script>
